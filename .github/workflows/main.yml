name: Sync fork with origin

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MIRROR_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Set mirror
        run: |
          git remote remove mirror >/dev/null 2>&1 || true
          git remote add mirror ${{ github.server_url }}/${{ github.repository }}.git
          
      - name: Add origin
        run: |
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "${{ vars.ORIGIN }}.git"
          git fetch --prune --tags origin

      - name: Sync default branch from origin
        shell: bash
        run: |
          default_branch="$(git ls-remote --symref ${{ vars.ORIGIN }}.git HEAD | awk '/^ref:/ {sub("refs/heads/","",$2); print $2}')"
          echo "Default branch: $default_branch"

          git checkout "$default_branch"
          git reset --hard "origin/$default_branch"
          git push --force-with-lease mirror "$default_branch"

      - name: Sync all branches
        shell: bash
        run: |
          git for-each-ref --format='%(refname:short)' refs/remotes/origin | sed 's#^origin/##' | while read -r branch; do
            [ -n "$branch" ] || continue
            [ "$branch" != "HEAD" ] || continue
            [ "$branch" != "mirror" ] || continue
            git checkout -B "$branch" "origin/$branch"
            git push --force-with-lease mirror "$branch"
          done
