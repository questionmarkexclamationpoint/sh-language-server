name: Sync fork with origin

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    environment: mirror
    runs-on: ubuntu-latest

    steps:
      - name: Acquire a better shell
        run: command -v zsh || sudo apt-get install -y zsh
        
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MIRROR_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      - name: Set mirror
        run: |
          git remote remove mirror >/dev/null 2>&1 || true
          git remote add mirror ${{ github.server_url }}/${{ github.repository }}.git
          
      - name: Add origin
        run: |
          git remote remove origin >/dev/null 2>&1 || true
          git remote add origin "${{ vars.ORIGIN }}.git"
          git fetch --prune --tags origin

      - name: Sync default branch from origin
        shell: bash
        run: |
          zsh <<'EOF'
          () {
            emulate -LR zsh
            setopt extendedglob
            local default_branch=${${"$(git ls-remote --symref '${{ vars.ORIGIN }}' HEAD)"#*refs/heads/}%%[[:space:]]##HEAD*}
            print -r -- 'Default branch: '$default_branch
            git checkout $default_branch
            git reset --hard origin/$default_branch
            git push --force-with-lease mirror $default_branch
          }
          EOF

      - name: Sync all branches
        shell: bash
        run: |
          zsh <<'EOF'
          () {
            emulate -LR zsh
            local ref= branch=
            for ref in ${(f)"$(git for-each-ref --format='%(refname:short)' refs/remotes/origin)"}; do
              if [[ $ref != origin/* ]] continue
              branch=${ref#origin/}
              if [[ -z $branch || $branch == HEAD || $branch == "${{ github.event.repository.default_branch }}" ]] continue
              git checkout -B $branch origin/$branch
              git push --force-with-lease mirror $branch
            done
          }
          EOF
